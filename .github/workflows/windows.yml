name: Windows

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Merge-queue and main runs each test
# one exact commit and are never cancelled or replaced.
concurrency:
  group: windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - Debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure, build and test
        shell: pwsh
        run: ./scripts/verify.ps1 -Configuration ${{ matrix.configuration }}
